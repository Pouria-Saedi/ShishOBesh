<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Admin — Shish O Besh</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap');

  :root{
    --bg:#FAF6EE;
    --bg-panel:#F1E9DB;
    --bg-cta:#F4E7E3;
    --ink:#241C14;
    --ink-muted:#6E5D48;
    --ink-faint:#9C8C74;
    --brass:#8A5C2C;
    --brass-bright:#A96F34;
    --oxblood:#6E2A34;
    --oxblood-bright:#8E3346;
    --good:#3E6B4F;
    --line: rgba(36,28,20,0.14);
    --display: 'Fraunces', serif;
    --body: 'Jost', sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#15110D;
    --bg-panel:#1C1610;
    --bg-cta:#231017;
    --ink:#EDE4D3;
    --ink-muted:#A99A82;
    --ink-faint:#786A56;
    --brass:#B4864F;
    --brass-bright:#D3A868;
    --oxblood:#8E3346;
    --oxblood-bright:#B24B5E;
    --good:#5C9270;
    --line: rgba(237,228,211,0.12);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    font-weight:300;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  h1,h2,h3{ font-family:var(--display); margin:0; }
  a{ color:inherit; }
  ::selection{ background:var(--brass); color:var(--bg); }
  :focus-visible{ outline:1.5px solid var(--brass-bright); outline-offset:2px; }

  .wrap{ max-width:1200px; margin:0 auto; padding:0 28px; }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:18px 0;
  }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .topbar-title{ display:flex; align-items:center; gap:10px; }
  .topbar-title svg{ width:20px; height:20px; flex:none; }
  .topbar-title svg polygon{ fill:var(--brass); }
  .topbar-title h1{ font-size:19px; font-style:italic; font-weight:500; }
  .topbar-title span{ display:block; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:2px; }
  .topbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:10px 18px;
    font-family:var(--body);
    font-size:13px;
    letter-spacing:0.03em;
    border-radius:2px;
    cursor:pointer;
    border:1px solid transparent;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .btn-primary{ background:var(--brass); color:var(--bg); border-color:var(--brass); }
  .btn-primary:hover{ background:var(--brass-bright); border-color:var(--brass-bright); }
  .btn-ghost{ border-color:var(--line); color:var(--ink); background:none; }
  .btn-ghost:hover{ border-color:var(--brass); color:var(--brass-bright); }
  .btn-danger{ border-color:var(--oxblood); color:var(--oxblood); background:none; }
  .btn-danger:hover{ background:var(--oxblood); color:var(--bg); }
  .btn-small{ padding:6px 12px; font-size:12px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .theme-toggle{
    background:none; border:1px solid var(--line); border-radius:999px;
    width:40px; height:24px; padding:0 4px;
    display:flex; align-items:center;
    cursor:pointer; position:relative;
  }
  .tt-knob{
    width:16px; height:16px; border-radius:50%;
    background:var(--brass);
    transition:transform .25s ease;
  }
  html[data-theme="dark"] .tt-knob{ transform:translateX(15px); }

  /* ---------- layout ---------- */
  main{ padding:36px 0 80px; }
  .file-banner{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:14px 20px;
    margin-bottom:30px;
    font-size:13px;
    color:var(--ink-muted);
  }
  .github-connect{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .github-connect input{
    width:190px;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink);
    font:inherit;
    font-size:12px;
    padding:7px 9px;
    border-radius:2px;
  }
  .github-connect input:focus{ outline:none; border-color:var(--brass); }
  .file-banner strong{ color:var(--ink); font-weight:500; }

  /* ---------- stat cards ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:36px;
  }
  .stat-card{ background:var(--bg); padding:22px 24px; }
  .stat-card .stat-label{ font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px; }
  .stat-card .stat-value{ font-family:var(--display); font-size:28px; font-style:italic; }
  .stat-card.alert .stat-value{ color:var(--oxblood); }

  /* ---------- charts ---------- */
  .chart-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:36px;
  }
  .chart-card{ background:var(--bg); padding:24px 26px; }
  .chart-card h3{ font-size:14px; font-weight:500; font-style:italic; margin-bottom:16px; }
  .chart-empty{ color:var(--ink-faint); font-size:13px; padding:30px 0; text-align:center; }

  /* ---------- toolbar ---------- */
  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .toolbar h2{ font-size:20px; font-style:italic; font-weight:500; }
  .search-input{
    background:var(--bg-panel);
    border:1px solid var(--line);
    padding:9px 14px;
    font-family:var(--body);
    font-size:13px;
    color:var(--ink);
    width:220px;
  }
  .search-input:focus{ outline:none; border-color:var(--brass); }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); }
  table{ width:100%; border-collapse:collapse; min-width:900px; }
  thead th{
    text-align:left;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:400;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    background:var(--bg-panel);
  }
  tbody td{
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
    font-size:13.5px;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--bg-panel); }
  .prod-cell{ display:flex; align-items:center; gap:12px; }
  .prod-thumb{
    width:44px; height:44px;
    object-fit:cover;
    border:1px solid var(--line);
    flex:none;
    background:var(--bg-panel);
  }
  .prod-thumb-fallback{
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    color:var(--brass);
    flex:none;
  }
  .prod-thumb-fallback svg{ width:16px; height:16px; }
  .prod-name{ font-family:var(--display); font-style:italic; }
  .prod-sku{ font-size:11px; color:var(--ink-faint); }
  .badge{
    display:inline-block;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:999px;
    border:1px solid currentColor;
  }
  .badge-good{ color:var(--good); }
  .badge-low{ color:var(--brass-bright); }
  .badge-out{ color:var(--oxblood); }
  .badge-inactive{ color:var(--ink-faint); }
  .row-actions{ display:flex; gap:8px; }
  .icon-btn{
    background:none; border:1px solid var(--line); cursor:pointer;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-muted);
    transition:all .2s ease;
  }
  .icon-btn:hover{ border-color:var(--brass); color:var(--brass-bright); }
  .icon-btn.danger:hover{ border-color:var(--oxblood); color:var(--oxblood); }
  .icon-btn svg{ width:14px; height:14px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    z-index:100;
    opacity:0; visibility:hidden;
    transition:opacity .25s ease, visibility .25s ease;
  }
  .modal-overlay.open{ opacity:1; visibility:visible; }
  .modal-card{
    background:var(--bg);
    border:1px solid var(--line);
    max-width:640px; width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:32px 34px;
    position:relative;
  }
  .modal-card h2{ font-size:22px; font-style:italic; font-weight:500; margin-bottom:22px; }
  .modal-close{
    position:absolute; top:26px; right:26px;
    background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px;
  }
  .modal-close svg{ width:16px; height:16px; }
  .modal-close svg line{ stroke:currentColor; stroke-width:1.4; stroke-linecap:round; }
  .modal-close:hover{ color:var(--brass-bright); }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 18px; }
  .field-full{ grid-column:1 / -1; }
  .field label{ display:block; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
  .field input, .field textarea{
    width:100%;
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--body);
    font-size:13.5px;
    padding:10px 12px;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--brass); }
  .field-hint{ font-size:11px; color:var(--ink-faint); margin-top:5px; }
  .checkbox-field label{ display:flex; align-items:center; gap:8px; text-transform:none; font-size:13px; color:var(--ink); letter-spacing:0; }
  .checkbox-field input{ width:auto; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:26px; padding-top:22px; border-top:1px solid var(--line); }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--bg);
    padding:13px 22px;
    font-size:13px;
    border-radius:2px;
    z-index:200;
    opacity:0; visibility:hidden;
    transition:opacity .25s ease, transform .25s ease, visibility .25s ease;
    max-width:90vw;
    text-align:center;
  }
  .toast.show{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }

  @media (max-width:860px){
    .btn{ padding:8px 14px; font-size:12px; }
    .btn-small{ padding:5px 10px; font-size:11px; }
    .stat-grid{ grid-template-columns:repeat(2, 1fr); }
    .chart-grid{ grid-template-columns:1fr; }
    .form-grid{ grid-template-columns:1fr; }
    .toolbar{ flex-direction:column; align-items:flex-start; }
    .search-input{ width:100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="topbar-title">
      <svg viewBox="0 0 10 10" aria-hidden="true"><polygon points="0,10 5,0 10,10"/></svg>
      <div>
        <h1>Catalog Admin</h1>
        <span>Shish O Besh</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme"><span class="tt-knob"></span></button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="file-banner" id="fileBanner">
      <span>Working on <strong id="fileNameLabel">products.json</strong> &mdash; changes commit automatically to GitHub.</span>
      <div class="github-connect">
        <input type="password" id="githubToken" placeholder="GitHub token" aria-label="GitHub token" autocomplete="off">
        <button class="btn btn-primary btn-small" id="connectGithubBtn" type="button">Connect GitHub</button>
      </div>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>Stock by Product</h3>
        <div id="stockChart"></div>
      </div>
      <div class="chart-card">
        <h3>Inventory Value by Product</h3>
        <div id="valueChart"></div>
      </div>
    </div>

    <div class="toolbar">
      <h2>Products</h2>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <input type="text" class="search-input" id="searchInput" placeholder="Search products&hellip;">
        <button class="btn btn-primary btn-small" id="addProductBtn" type="button">+ Add Product</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>

  </div>
</main>

<!-- ============ PRODUCT MODAL ============ -->
<div class="modal-overlay" id="productModalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="productModalClose" type="button" aria-label="Close">
      <svg viewBox="0 0 14 14" aria-hidden="true"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
    </button>
    <h2 id="productModalTitle">Add Product</h2>
    <form id="productForm">
      <input type="hidden" id="pf-originalId">
      <div class="form-grid">
        <div class="field">
          <label for="pf-name">Name</label>
          <input type="text" id="pf-name" required>
        </div>
        <div class="field">
          <label for="pf-id">Product ID (slug)</label>
          <input type="text" id="pf-id" required pattern="[a-z0-9\-]+">
          <p class="field-hint">Lowercase, no spaces. Changing this on an existing product can break links to it.</p>
        </div>
        <div class="field field-full">
          <label for="pf-materials">Materials</label>
          <input type="text" id="pf-materials" placeholder="e.g. Walnut &amp; maple inlay">
        </div>
        <div class="field field-full">
          <label for="pf-description">Description</label>
          <textarea id="pf-description" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="pf-price">Price</label>
          <input type="number" id="pf-price" min="0" step="1" placeholder="Leave blank for &ldquo;Enquire&rdquo;">
        </div>
        <div class="field">
          <label for="pf-currency">Currency</label>
          <input type="text" id="pf-currency" value="EUR">
        </div>
        <div class="field">
          <label for="pf-stock">Stock</label>
          <input type="number" id="pf-stock" min="0" step="1" required value="0">
        </div>
        <div class="field">
          <label for="pf-lowStockThreshold">Low-stock alert below</label>
          <input type="number" id="pf-lowStockThreshold" min="0" step="1" value="2">
        </div>
        <div class="field">
          <label for="pf-category">Category</label>
          <input type="text" id="pf-category">
        </div>
        <div class="field">
          <label for="pf-sku">SKU</label>
          <input type="text" id="pf-sku">
        </div>
        <div class="field">
          <label for="pf-image">Image filename</label>
          <input type="text" id="pf-image" placeholder="e.g. product.webp">
        </div>
        <div class="field">
          <label for="pf-url">Product page URL (optional)</label>
          <input type="text" id="pf-url" placeholder="e.g. product.html">
        </div>
        <div class="field field-full checkbox-field">
          <label><input type="checkbox" id="pf-active" checked> Active (visible on the live site)</label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="productModalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Product</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var products = [];
  var githubToken = '';
  var githubFileSha = null;
  var editingId = null;

  var GITHUB_API_URL = 'https://api.github.com/repos/Pouria-Saedi/ShishOBesh/contents/data/products.json';

  var SAMPLE_PRODUCTS = [
    { id:"urmia-60", name:"The Urmia", materials:"Walnut & walnut root", description:"Persepolis reliefs outside, natural walnut root within. Our best seller.", price:null, currency:"EUR", stock:6, lowStockThreshold:2, category:"Best Seller", image:"../products/urmia-60/assets/urmia-closed-full.webp", url:"../products/urmia-60/urmia-60.html", sku:"SOB-URM-060", active:true },
    { id:"walnut-standard", name:"The Walnut Standard", materials:"Walnut & maple inlay", description:"Our founding board. Full-size, hand-carved points, brass hardware.", price:1450, currency:"EUR", stock:4, lowStockThreshold:2, category:"Standard", image:"", url:"", sku:"SOB-WAL-001", active:true },
    { id:"rosewood-traveler", name:"The Rosewood Traveler", materials:"Rosewood & boxwood", description:"A folding case built for the desk, the study, or the cabin.", price:1890, currency:"EUR", stock:3, lowStockThreshold:2, category:"Traveler", image:"", url:"", sku:"SOB-ROS-001", active:true },
    { id:"ebony-reserve", name:"The Ebony Reserve", materials:"Ebony & sycamore", description:"Twelve made each year. Heavier wood, slower work.", price:4200, currency:"EUR", stock:5, lowStockThreshold:2, category:"Reserve", image:"", url:"", sku:"SOB-EBY-001", active:true },
    { id:"achaemenid-70", name:"The Achaemenid 70", materials:"Sanjed burl & blue resin", description:"Hand-carved Achaemenid reliefs outside, a river of blue resin within.", price:null, currency:"EUR", stock:1, lowStockThreshold:1, category:"Museum Edition", image:"../products/achaemenid-70/assets/prod-closed-full.webp", url:"../products/achaemenid-70/achaemenid-70.html", sku:"SOB-ACH-070", active:true }
  ];

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function formatPrice(p, currency){
    if(typeof p !== 'number') return 'Enquire';
    var symbol = currency === 'USD' ? '$' : (currency === 'GBP' ? '\u00A3' : '\u20AC');
    return symbol + p.toLocaleString('en-US');
  }

  function slugify(str){
    return String(str).toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
  }

  /* ---------- GitHub catalog handling ---------- */
  function loadProducts(list, label){
    products = list;
    document.getElementById('fileNameLabel').textContent = label;
    renderAll();
  }

  function decodeBase64(value){
    var binary = atob(value.replace(/\s/g, ''));
    var bytes = new Uint8Array(binary.length);
    for(var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function encodeBase64(value){
    var bytes = new TextEncoder().encode(value);
    var binary = '';
    for(var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  async function githubRequest(options){
    var headers = {
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    };
    if(githubToken) headers.Authorization = 'Bearer ' + githubToken;
    var response = await fetch(GITHUB_API_URL, { ...options, headers:headers });
    if(!response.ok){
      var detail = await response.json().catch(function(){ return {}; });
      throw new Error(detail.message || ('GitHub request failed (' + response.status + ')'));
    }
    return response.json();
  }

  async function tryAutoFetch(){
    try {
      var result = await githubRequest({ method:'GET', cache:'no-store' });
      githubFileSha = result.sha;
      loadProducts(JSON.parse(decodeBase64(result.content)), 'products.json on GitHub');
    } catch(e){
      try {
        var res = await fetch('../data/products.json', { cache: 'no-store' });
        if(!res.ok) throw new Error('not found');
        loadProducts(await res.json(), 'products.json (local copy)');
      } catch(fallbackError){
        loadProducts(JSON.parse(JSON.stringify(SAMPLE_PRODUCTS)), 'sample data');
        showToast('Could not load products.json from GitHub.');
      }
    }
  }

  async function saveFile(){
    if(!githubToken){
      showToast('Connect GitHub before making catalog changes.');
      document.getElementById('githubToken').focus();
      return false;
    }
    var json = JSON.stringify(products, null, 2);
    try{
      var result = await githubRequest({
        method:'PUT',
        headers:{ 'Content-Type':'application/json' },
        body:JSON.stringify({
          message:'Update product catalog',
          content:encodeBase64(json),
          sha:githubFileSha,
          branch:'main'
        })
      });
      githubFileSha = result.content.sha;
      showToast('Catalog updated on GitHub.');
      return true;
    } catch(e){
      showToast(e.message);
      return false;
    }
  }

  document.getElementById('connectGithubBtn').addEventListener('click', async function(){
    var input = document.getElementById('githubToken');
    githubToken = input.value.trim();
    if(!githubToken){ showToast('Enter a GitHub token first.'); return; }
    try{
      var result = await githubRequest({ method:'GET', cache:'no-store' });
      githubFileSha = result.sha;
      loadProducts(JSON.parse(decodeBase64(result.content)), 'products.json on GitHub');
      input.value = '';
      input.placeholder = 'Connected to GitHub';
      showToast('GitHub connected. Changes will commit automatically.');
    } catch(e){
      githubToken = '';
      showToast('GitHub connection failed: ' + e.message);
    }
  });

  /* ---------- stock status ---------- */
  function stockStatus(p){
    if(!p.active) return { label:'Inactive', cls:'badge-inactive' };
    if(p.stock <= 0) return { label:'Sold Out', cls:'badge-out' };
    if(p.stock <= (p.lowStockThreshold || 0)) return { label:'Low Stock', cls:'badge-low' };
    return { label:'In Stock', cls:'badge-good' };
  }

  /* ---------- stats ---------- */
  function renderStats(){
    var total = products.length;
    var units = products.reduce(function(s,p){ return s + (p.stock||0); }, 0);
    var value = products.reduce(function(s,p){ return s + (typeof p.price === 'number' ? p.price * (p.stock||0) : 0); }, 0);
    var lowCount = products.filter(function(p){ return p.active && p.stock > 0 && p.stock <= (p.lowStockThreshold||0); }).length;
    var outCount = products.filter(function(p){ return p.active && p.stock <= 0; }).length;

    var cards = [
      { label:'Total Products', value: total },
      { label:'Units in Stock', value: units },
      { label:'Inventory Value', value: '\u20AC' + value.toLocaleString('en-US') },
      { label:'Low Stock / Sold Out', value: (lowCount + outCount), alert: (lowCount+outCount) > 0 }
    ];
    var html = '';
    cards.forEach(function(c){
      html += '<div class="stat-card' + (c.alert ? ' alert' : '') + '"><div class="stat-label">' + c.label + '</div><div class="stat-value">' + c.value + '</div></div>';
    });
    document.getElementById('statGrid').innerHTML = html;
  }

  /* ---------- charts (hand-drawn SVG, no dependency) ---------- */
  function renderBarChart(containerId, data, opts){
    var container = document.getElementById(containerId);
    if(!container) return;
    if(data.length === 0){ container.innerHTML = '<p class="chart-empty">No products yet.</p>'; return; }

    var rowH = 30, gap = 10;
    var h = data.length * rowH + (data.length - 1) * gap + 10;
    var w = 560;
    var padLeft = 130, padRight = 70;
    var maxVal = Math.max(1, Math.max.apply(null, data.map(function(d){ return d.value; })));

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="xMinYMin meet">';
    data.forEach(function(d, i){
      var y = i * (rowH + gap);
      var barW = Math.max(2, (w - padLeft - padRight) * (d.value / maxVal));
      svg += '<text x="' + (padLeft - 10) + '" y="' + (y + rowH/2 + 4) + '" text-anchor="end" font-size="12" font-family="Jost, sans-serif" style="fill:var(--ink-muted)">' + escapeHtml(d.label) + '</text>';
      svg += '<rect x="' + padLeft + '" y="' + y + '" width="' + barW + '" height="' + rowH + '" style="fill:' + d.color + '" rx="1"/>';
      svg += '<text x="' + (padLeft + barW + 10) + '" y="' + (y + rowH/2 + 4) + '" font-size="12" font-family="Jost, sans-serif" style="fill:var(--ink)">' + escapeHtml(d.valueLabel) + '</text>';
    });
    svg += '</svg>';
    container.innerHTML = svg;
  }

  function renderCharts(){
    var brass = getComputedStyle(document.documentElement).getPropertyValue('--brass').trim() || '#8A5C2C';
    var oxblood = getComputedStyle(document.documentElement).getPropertyValue('--oxblood').trim() || '#6E2A34';
    var faint = getComputedStyle(document.documentElement).getPropertyValue('--ink-faint').trim() || '#9C8C74';

    var stockData = products.map(function(p){
      var status = stockStatus(p);
      var color = status.cls === 'badge-out' ? oxblood : (status.cls === 'badge-low' ? brass : faint);
      return { label: p.name, value: p.stock || 0, valueLabel: String(p.stock || 0), color: color };
    });
    renderBarChart('stockChart', stockData);

    var valueData = products.map(function(p){
      var val = typeof p.price === 'number' ? p.price * (p.stock||0) : 0;
      return { label: p.name, value: val, valueLabel: typeof p.price === 'number' ? ('\u20AC' + val.toLocaleString('en-US')) : 'Enquire', color: brass };
    });
    renderBarChart('valueChart', valueData);
  }

  /* ---------- table ---------- */
  function renderTable(){
    var body = document.getElementById('productTableBody');
    var query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    var filtered = products.filter(function(p){
      if(!query) return true;
      return (p.name||'').toLowerCase().indexOf(query) > -1 ||
             (p.category||'').toLowerCase().indexOf(query) > -1 ||
             (p.sku||'').toLowerCase().indexOf(query) > -1;
    });

    if(filtered.length === 0){
      body.innerHTML = '<tr><td colspan="6"><div class="empty-state">' + (products.length === 0 ? 'No products yet. Click \u201c+ Add Product\u201d to create one.' : 'No products match your search.') + '</div></td></tr>';
      return;
    }

    var html = '';
    filtered.forEach(function(p){
      var status = stockStatus(p);
      var thumb = p.image
        ? '<img class="prod-thumb" src="' + escapeHtml(p.image) + '" alt="">'
        : '<span class="prod-thumb-fallback"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="2,20 12,4 22,20" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>';
      html +=
        '<tr>' +
          '<td><div class="prod-cell">' + thumb + '<div><div class="prod-name">' + escapeHtml(p.name) + '</div><div class="prod-sku">' + escapeHtml(p.sku||'') + '</div></div></div></td>' +
          '<td>' + escapeHtml(p.category||'\u2014') + '</td>' +
          '<td>' + formatPrice(p.price, p.currency) + '</td>' +
          '<td>' + (p.stock != null ? p.stock : '\u2014') + '</td>' +
          '<td><span class="badge ' + status.cls + '">' + status.label + '</span></td>' +
          '<td><div class="row-actions">' +
            '<button class="icon-btn" data-edit="' + escapeHtml(p.id) + '" type="button" aria-label="Edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>' +
            '<button class="icon-btn danger" data-delete="' + escapeHtml(p.id) + '" type="button" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
          '</div></td>' +
        '</tr>';
    });
    body.innerHTML = html;
  }

  function renderAll(){
    renderStats();
    renderCharts();
    renderTable();
  }

  document.getElementById('searchInput').addEventListener('input', renderTable);

  /* ---------- modal ---------- */
  var overlay = document.getElementById('productModalOverlay');
  var form = document.getElementById('productForm');

  function openModal(product){
    editingId = product ? product.id : null;
    document.getElementById('productModalTitle').textContent = product ? 'Edit Product' : 'Add Product';
    document.getElementById('pf-originalId').value = product ? product.id : '';
    document.getElementById('pf-id').value = product ? product.id : '';
    document.getElementById('pf-name').value = product ? product.name : '';
    document.getElementById('pf-materials').value = product ? (product.materials||'') : '';
    document.getElementById('pf-description').value = product ? (product.description||'') : '';
    document.getElementById('pf-price').value = product && typeof product.price === 'number' ? product.price : '';
    document.getElementById('pf-currency').value = product ? (product.currency||'EUR') : 'EUR';
    document.getElementById('pf-stock').value = product ? (product.stock||0) : 0;
    document.getElementById('pf-lowStockThreshold').value = product ? (product.lowStockThreshold != null ? product.lowStockThreshold : 2) : 2;
    document.getElementById('pf-category').value = product ? (product.category||'') : '';
    document.getElementById('pf-sku').value = product ? (product.sku||'') : '';
    document.getElementById('pf-image').value = product ? (product.image||'') : '';
    document.getElementById('pf-url').value = product ? (product.url||'') : '';
    document.getElementById('pf-active').checked = product ? !!product.active : true;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('pf-name').focus();
  }

  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('addProductBtn').addEventListener('click', function(){ openModal(null); });
  document.getElementById('productModalClose').addEventListener('click', closeModal);
  document.getElementById('productModalCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  document.getElementById('pf-name').addEventListener('input', function(){
    if(editingId === null && !document.getElementById('pf-id')._touched){
      document.getElementById('pf-id').value = slugify(this.value);
    }
  });
  document.getElementById('pf-id').addEventListener('input', function(){ this._touched = true; });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var id = slugify(document.getElementById('pf-id').value);
    var originalId = document.getElementById('pf-originalId').value;

    var duplicate = products.some(function(p){ return p.id === id && p.id !== originalId; });
    if(duplicate){ showToast('That product ID is already in use \u2014 choose a different one.'); return; }

    var priceRaw = document.getElementById('pf-price').value;
    var record = {
      id: id,
      name: document.getElementById('pf-name').value.trim(),
      materials: document.getElementById('pf-materials').value.trim(),
      description: document.getElementById('pf-description').value.trim(),
      price: priceRaw === '' ? null : parseFloat(priceRaw),
      currency: document.getElementById('pf-currency').value.trim() || 'EUR',
      stock: parseInt(document.getElementById('pf-stock').value, 10) || 0,
      lowStockThreshold: parseInt(document.getElementById('pf-lowStockThreshold').value, 10) || 0,
      category: document.getElementById('pf-category').value.trim(),
      sku: document.getElementById('pf-sku').value.trim(),
      image: document.getElementById('pf-image').value.trim(),
      url: document.getElementById('pf-url').value.trim(),
      active: document.getElementById('pf-active').checked
    };

    if(originalId){
      var idx = products.findIndex(function(p){ return p.id === originalId; });
      if(idx > -1) products[idx] = record;
    } else {
      products.push(record);
    }

    closeModal();
    renderAll();
    await saveFile();
  });

  document.getElementById('productTableBody').addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit]');
    var delBtn = e.target.closest('[data-delete]');
    if(editBtn){
      var p = products.find(function(p){ return p.id === editBtn.getAttribute('data-edit'); });
      if(p) openModal(p);
    } else if(delBtn){
      var id = delBtn.getAttribute('data-delete');
      var p2 = products.find(function(p){ return p.id === id; });
      if(p2 && confirm('Delete "' + p2.name + '"? This can\'t be undone here.')){
        products = products.filter(function(p){ return p.id !== id; });
        renderAll();
        saveFile();
      }
    }
  });

  /* ---------- theme toggle ---------- */
  var root = document.documentElement;
  document.getElementById('themeToggle').addEventListener('click', function(){
    var isDark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    renderCharts();
  });

  /* ---------- init ---------- */
  tryAutoFetch();
})();
</script>
</body>
</html>
